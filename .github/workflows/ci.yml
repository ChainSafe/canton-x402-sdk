name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: packages resolve their workspace deps from `dist/` (the
      # `exports`/`types` targets), so typecheck and test need it present. `pnpm -r`
      # builds in topological order (x402-core before x402-client). dist is a build
      # artifact now (not committed) — the release job rebuilds it via `prepack`.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  changeset:
    name: changeset present
    # Every PR that touches packages/** must carry a changeset (use
    # `pnpm changeset --empty` for changes that need no release). Skipped on the
    # push-to-main event, where there's no base branch to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset status diffs against the base branch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Exits non-zero when a package changed without a changeset — fails the check.
      - name: Require a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
