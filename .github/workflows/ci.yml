name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: packages resolve their workspace deps from `dist/` (the
      # `exports`/`types` targets), so typecheck and test need it present. `pnpm -r`
      # builds in topological order (x402-core before x402-client).
      - name: Build
        run: pnpm build

      # dist is committed (shipped to git-dependency consumers). Fail if a fresh
      # build doesn't match what's committed, so stale artifacts can't ship.
      - name: Verify committed dist is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::packages/*/dist is stale — run 'pnpm -r build' and commit the result."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
