# The docs site: built on every pull request, published to GitHub Pages on main.
#
# NO `paths:` FILTER, deliberately. The build job is a required check, and a
# required check that is skipped never reports — GitHub then waits for it
# forever and the pull request cannot merge. Running it on every PR costs a few
# seconds and removes that trap entirely. ci.yml makes the same choice.
#
# Internal links need no separate tool: `vitepress build` exits non-zero on a
# dead one, so the build step is the link check. External links are NOT
# checked, and should not be from a required job — they fail for reasons that
# are not ours. A scheduled run is the place for those, if they are ever wanted.
#
# A pull request gets the built site as a downloadable artifact rather than a
# URL: GitHub Pages has one environment and no preview deployments. Moving to a
# per-PR URL means a host that supports it (Cloudflare Pages, as the facilitator
# uses) and its token in this repo's secrets — a contained change to this file.
name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The name a branch-protection rule names. Changing it silently un-requires
    # the check, so change the rule with it.
    name: build docs
    runs-on: ubuntu-latest
    # Supersede an earlier run on the same ref; a merge to main is handled by
    # the deploy job's own group, which must not be cancelled mid-publish.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on a dead internal link, which is what makes this a link check.
      - name: Build
        run: pnpm docs:build

      # What a reviewer opens, in place of the preview URL Pages cannot give.
      - name: Upload the site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
          retention-days: 7

      - name: Upload the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: publish to Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One publish at a time, and never cancelled: a half-finished deploy would
    # leave the live site on whichever files happened to upload.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
