name: Release

# Changesets flow: a push to main with pending changesets opens (or updates) a
# "Version Packages" PR that bumps versions and writes changelogs. Merging that
# PR runs `changeset publish`, which publishes every package whose version isn't
# already on npm — independently, in topological order.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Version PR / push tags
  pull-requests: write # open and update the Version PR
  id-token: write # npm provenance (OIDC)
  actions: write # dispatch the docs publish once something is actually released

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The ONE authoritative build. It's topological (deps before dependents),
      # so cross-package type declarations resolve. Packages intentionally have NO
      # `prepack` — `changeset publish` runs per-package publishes in parallel, and
      # a per-package tsup rebuild there races (a dependent's dts build reads a
      # sibling's dist while the sibling is mid-rebuild → TS2307). Build once here;
      # publish ships these prebuilt artifacts (`files: ["dist"]`).
      - name: Build
        run: pnpm build

      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Publishes the artifacts built by the Build step above (no rebuild on
          # publish — see the Build step for why).
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The docs site tracks RELEASES, not main (see docs.yml): a plain merge
      # leaves the site on the released API, and merging the Version PR moves it.
      #
      # NO `if:` ON THE STEP, deliberately. A skipped step is invisible — if
      # `published` ever stopped being "true" the docs would quietly stop
      # deploying, nothing would fail, and the first sign would be a stale site
      # weeks later. Branching inside the script costs one line and makes every
      # release state in its summary which way it went.
      - name: Publish the docs for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Through the environment, as everywhere else in this repo: `${{ }}`
          # inside a `run:` body is substituted textually before the shell sees it.
          PUBLISHED: ${{ steps.changesets.outputs.published }}
        run: |
          if [ "$PUBLISHED" != "true" ]; then
            echo "Nothing was published (published='$PUBLISHED')." \
              "The docs site stays on the last released API." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # By FILENAME, not by the `name:` inside it — renaming the workflow
          # would otherwise break this silently. A dispatch is the one thing
          # GITHUB_TOKEN may still trigger; a push or a tag from here could not.
          gh workflow run docs.yml --ref main
          echo "Dispatched the docs publish for this release." >> "$GITHUB_STEP_SUMMARY"
